# 4g rather than the 1g default: AGP's dexing and KSP both want headroom, and
# an OOM here shows up as an unrelated-looking Kotlin daemon crash.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# AndroidX, and only AndroidX. Jetifier rewrites legacy support-library
# bytecode at build time; nothing here has ever depended on it.
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R classes: a module's R holds only its own resources, so a
# resource cannot be silently inherited from a dependency and then vanish when
# that dependency is dropped.
android.nonTransitiveRClass=true

# Kotlin daemon inherits the build JVM's memory settings rather than its own
# smaller default.
kotlin.daemon.jvmargs=-Xmx3g

kotlin.code.style=official
