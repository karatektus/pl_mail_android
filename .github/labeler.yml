# Area labels for pull requests, from the files they touch — applied by
# pr-hygiene.yml. So that somebody who knows the push path can find the pull
# requests that change it without reading every title.
#
# Broad on purpose: a label that is sometimes one too many is cheap, one that
# is missing is how a change slips past the person who would have caught it.
# The areas follow the modules, because that is where the boundaries already
# are; `area: push` is the exception, cut across them, because the push path
# runs through app/, core/data, core/datastore, core/jmap and settings at once.

"area: mail":
    - changed-files:
          - any-glob-to-any-file:
                - feature/mail/**
                - core/database/**

"area: compose":
    - changed-files:
          - any-glob-to-any-file:
                - feature/compose/**

"area: calendar":
    - changed-files:
          - any-glob-to-any-file:
                - feature/calendar/**

"area: search":
    - changed-files:
          - any-glob-to-any-file:
                - feature/search/**

"area: settings":
    - changed-files:
          - any-glob-to-any-file:
                - feature/settings/**

"area: onboarding":
    - changed-files:
          - any-glob-to-any-file:
                - feature/onboarding/**

"area: push":
    - changed-files:
          - any-glob-to-any-file:
                - app/src/main/kotlin/de/plmail/push/**
                - app/src/google/**
                - core/notifications/**
                - '**/*Push*'

"area: jmap":
    - changed-files:
          - any-glob-to-any-file:
                - core/jmap/**

"area: build":
    - changed-files:
          - any-glob-to-any-file:
                - build-logic/**
                - gradle/**
                - '*.gradle.kts'
                - '**/build.gradle.kts'
                - gradle.properties
                - .github/workflows/**
                - .github/scripts/**

documentation:
    - changed-files:
          - any-glob-to-any-file:
                - docs/**
                - README.md
                - CONTRIBUTING.md
