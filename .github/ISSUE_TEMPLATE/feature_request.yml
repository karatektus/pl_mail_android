name: Feature
description: Something the app should do, or do differently.
labels: [enhancement, needs-triage]
body:
    - type: markdown
      attributes:
          value: |
              A feature is agreed here before it is built. If you mean to write it yourself, say so below and wait for the `accepted` label before opening a pull request — it saves you building something that has to be redone. See CONTRIBUTING.md, "How work gets in".

              Many features need the server to do something first. If the web app cannot do it either, it may belong in [pl_mail](https://github.com/karatektus/pl_mail/issues/new/choose), with this issue as its counterpart.
    - type: textarea
      id: problem
      attributes:
          label: The problem
          description: What you are trying to do, and what gets in the way today. The problem matters more than the solution.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: What you would like
          description: How you imagine it working. Where it lives in the app, whether it should be a setting, and whether the web app already does it.
    - type: textarea
      id: alternatives
      attributes:
          label: Other ways you considered
    - type: dropdown
      id: building
      attributes:
          label: Building it
          options:
              - I would like somebody else to build it
              - I want to build it myself, once it is accepted
      validations:
          required: true
